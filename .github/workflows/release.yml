name: Build and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("info.toml").read_text(encoding="utf-8"))
          meta = manifest.get("meta", {})
          missing = [key for key in ("name", "author", "category", "version") if not meta.get(key)]
          if missing:
              raise SystemExit(f"Missing required meta fields: {', '.join(missing)}")
          print(f"{meta['name']} {meta['version']}")
          PY

      - name: Build Openplanet package
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/CountersteerAdvisor.op \
            info.toml \
            main.as \
            settings.as \
            src \
            README.md \
            countersteer.md
          unzip -l dist/CountersteerAdvisor.op

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountersteerAdvisor
          path: dist/CountersteerAdvisor.op

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/CountersteerAdvisor.op \
            --title "${GITHUB_REF_NAME}" \
            --notes "Built from ${GITHUB_SHA}."
